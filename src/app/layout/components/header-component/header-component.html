<header class="h-14 flex items-center justify-between px-5 bg-white border-b border-slate-200 shadow-sm flex-shrink-0 z-10">

  <!-- Left: Logo -->
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 bg-slate-900 rounded-lg flex items-center justify-center flex-shrink-0">
      <span class="text-white font-bold text-base leading-none">B</span>
    </div>
    <span class="text-slate-900 font-bold text-lg tracking-tight select-none">BordUp™</span>

    <!-- Breadcrumb separator + crumbs -->
    @if (breadcrumbs.length) {
      <div class="hidden sm:flex items-center gap-1.5 ml-3 pl-3 border-l border-slate-200">
        @for (crumb of breadcrumbs; track crumb.label; let last = $last) {
          @if (crumb.route && !last) {
            <a [routerLink]="crumb.route"
               class="text-sm text-slate-400 hover:text-indigo-600 transition-colors">
              {{ crumb.label }}
            </a>
          } @else {
            <span class="text-sm"
                  [class.text-slate-800]="last"
                  [class.font-medium]="last"
                  [class.text-slate-400]="!last">
              {{ crumb.label }}
            </span>
          }
          @if (!last) {
            <lucide-icon [name]="icons.ChevronRight" class="w-3.5 h-3.5 text-slate-300 flex-shrink-0"></lucide-icon>
          }
        }
      </div>
    }
  </div>

  <!-- Right: actions -->
  <div class="flex items-center gap-3">

    <!-- Notification bell -->
    <button type="button"
            class="relative w-9 h-9 flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-700 transition-all">
      <lucide-icon [name]="icons.Bell" class="w-5 h-5"></lucide-icon>
      <!-- unread dot -->
      <span class="absolute top-2 right-2 w-2 h-2 bg-indigo-500 rounded-full ring-2 ring-white"></span>
    </button>

    <!-- Logout -->
    <button type="button"
            (click)="logout()"
            title="Log out"
            class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-red-50 hover:text-red-600 transition-colors">
      <lucide-icon [name]="icons.LogOut" class="w-4 h-4"></lucide-icon>
      <span class="hidden md:block text-sm font-medium select-none">Log out</span>
    </button>

  </div>
</header>
