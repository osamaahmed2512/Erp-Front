<aside class="flex h-full flex-shrink-0">

  <!-- ── Icon strip (48 px, medium-dark) ──────────────────────────── -->
  <div class="w-12 bg-slate-800 flex flex-col items-center pt-4 pb-4 gap-1 overflow-hidden flex-shrink-0 border-r border-slate-700">

    @for (mod of modules; track mod.name) {
      <button
        type="button"
        (click)="toggleModule(mod)"
        [title]="mod.name"
        class="relative w-9 h-9 flex items-center justify-center rounded-lg transition-all duration-200 group cursor-pointer"
        [class.bg-indigo-600]="activeModuleName === mod.name"
        [class.text-white]="activeModuleName === mod.name"
        [class.text-slate-400]="activeModuleName !== mod.name">

        <lucide-icon
          [name]="mod.icon"
          class="w-[18px] h-[18px] group-hover:text-slate-200 transition-colors">
        </lucide-icon>
      </button>
    }

    <div class="flex-1"></div>
  </div>

  <!-- ── Light panel (224 px) ─────────────────────────────────────── -->
  @if (activeModule) {
    <div class="w-56 bg-white flex flex-col border-r border-slate-200 flex-shrink-0 shadow-sm">

      <!-- Module title -->
      <div class="px-4 pt-4 pb-3 border-b border-slate-100 flex-shrink-0">
        <p class="text-[10px] font-bold uppercase tracking-widest text-indigo-600 select-none">
          {{ activeModule.name }}
        </p>
      </div>

      <!-- Categories + Pages -->
      <nav class="flex-1 overflow-y-auto py-3 sidebar-scroll">
        @for (cat of activeModule.categories; track cat.name) {
          <div class="mb-3 px-3">

            <!-- Category header -->
            <button
              type="button"
              (click)="toggleCategory(cat)"
              class="w-full flex items-center justify-between px-2 py-1 mb-1 text-[10px] font-bold uppercase tracking-widest text-slate-500 hover:text-slate-700 transition-colors cursor-pointer select-none">
              <span>{{ cat.name }}</span>
              <lucide-icon
                [name]="cat.expanded ? 'chevron-down' : 'chevron-right'"
                class="w-3 h-3 flex-shrink-0">
              </lucide-icon>
            </button>

            <!-- Pages -->
            @if (cat.expanded) {
              <div class="space-y-0.5">
                @for (page of cat.pages; track page.name) {
                  <a
                    [routerLink]="page.route"
                    routerLinkActive="nav-page-active"
                    class="nav-page-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-slate-700 hover:bg-slate-50 hover:text-slate-900 transition-all">
                    @if (page.iconImage) {
                      <lucide-icon [img]="page.iconImage" class="w-4 h-4 flex-shrink-0"></lucide-icon>
                    } @else {
                      <lucide-icon [name]="page.icon || 'circle'" class="w-4 h-4 flex-shrink-0"></lucide-icon>
                    }
                    <span class="truncate">{{ page.name }}</span>
                  </a>
                }
              </div>
            }

          </div>
        }
      </nav>

    </div>
  }

</aside>
