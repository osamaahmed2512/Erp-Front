<div class="flex flex-col">
  <app-page-header
    title="Positions"
    [showSearch]="true"
    [showAdd]="access.can('Positions.Create')"
    (searchChange)="search($event)"
    (addClick)="add()"
    (exportClick)="exportCsv()">
    <app-company-filter headerFilters [compact]="true" (companyChange)="filterCompany($event)"></app-company-filter>
  </app-page-header>

  <app-data-table
    [data]="data"
    [columns]="columns"
    [totalItems]="totalItems"
    [currentPage]="currentPage"
    [pageSize]="pageSize"
    [hasPreviousPage]="hasPreviousPage"
    [hasNextPage]="hasNextPage"
    [loading]="loading"
    [showEdit]="access.can('Positions.Edit')"
    [showDelete]="access.can('Positions.Delete')"
    [allowBadgeClick]="access.can('Positions.Edit')"
    (pageChange)="pageChanged($event)"
    (pageSizeChange)="pageSizeChanged($event)"
    (viewClick)="view($event)"
    (editClick)="edit($event)"
    (deleteClick)="remove($event)"
    (bageClick)="changeStatus($event)">
  </app-data-table>
</div>
