<div class="flex min-h-screen bg-white">
  <!-- Left Side: Login Form -->
  <div class="flex flex-1 flex-col justify-center px-6 py-12 lg:flex-none lg:px-20 xl:px-24">
    <div class="mx-auto w-full max-w-sm lg:w-96">
      <!-- Branding -->
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-[#0f172a] text-white">
          <span class="text-xl font-bold">B</span>
        </div>
        <h2 class="text-2xl font-bold tracking-tight text-slate-900">BordUp™</h2>
      </div>

      <div class="mt-10">
        <h3 class="text-lg font-semibold text-slate-900">Welcome Back</h3>
        <p class="mt-2 text-sm text-slate-600">Please sign in to your HR account.</p>
      </div>

      <div class="mt-8">
        <form #signUpForm="ngForm" class="space-y-6" (ngSubmit)="login()">
          <div>
            <label for="email"  class="block text-sm font-medium text-slate-700">Email address</label>
            <div class="mt-2">
              <input id="email" name="email" type="email" [(ngModel)]="email" required 
                class="block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm">
            </div>
          </div>

          <div>
            <label for="password"  class="block text-sm font-medium text-slate-700">Password</label>
            <div class="mt-2">
              <input id="password" name="password" type="password"  [(ngModel)]="password" required 
                class="block w-full rounded-lg border border-slate-300 px-3 py-2.5 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 sm:text-sm">
            </div>
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input id="remember-me" name="remember-me" type="checkbox" 
                class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
              <label for="remember-me" class="ml-2 block text-sm text-slate-700">Remember me</label>
            </div>
            <div class="text-sm">
              <a href="#" class="font-medium text-blue-600 hover:text-blue-500">Forgot password?</a>
            </div>
          </div>

          <div>
            <button type="submit" 
              class="flex w-full justify-center rounded-lg bg-[#0f172a] px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-slate-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-slate-600 transition-all">
              Sign In
            </button>
          </div>
        </form>

        <p class="mt-10 text-center text-sm text-slate-500">
          Not a member? 
          <a href="#" class="font-semibold text-blue-600 hover:text-blue-500">Contact HR Admin</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Right Side: Image -->
  <div class="relative hidden w-0 flex-1 lg:block">
    <img class="absolute inset-0 h-full w-full object-cover" 
         src="/images/northfolk-Ok76F6yW2iA-unsplash.jpg" 
         alt="BordUp Workspace">
    <!-- Subtle Overlay to match the design in watermarked_img_3476375059961003833.png -->
    <div class="absolute inset-0 bg-slate-900/10 mix-blend-multiply"></div>
  </div>
</div>
