<div class="flex flex-col">

  <app-page-header
    title="Departments"
    [showSearch]="true"
    [showAdd]="access.can('Departments.Create')"
    (searchChange)="handleSearch($event)"
    (addClick)="handleAddDepartement()"
    (exportClick)="handleExport()">
    <app-company-filter headerFilters [compact]="true" (companyChange)="filterCompany($event)"></app-company-filter>
  </app-page-header>

  <app-data-table
    [data]="data"
    [columns]="columns"
    [totalItems]="totalItems"
    [currentPage]="currentPage"
    [pageSize]="pageSize"
    [hasPreviousPage]="hasPreviousPage"
    [hasNextPage]="hasNextPage"
    [loading]="loading"
    [showEdit]="access.can('Departments.Edit')"
    [showDelete]="access.can('Departments.Delete')"
    [allowBadgeClick]="access.can('Departments.Edit')"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (viewClick)="onView($event)"
    (editClick)="onEdit($event)"
    (deleteClick)="onDelete($event)"
    (bageClick)="changeStatus($event)"
    >

  </app-data-table>

</div>
