<form [formGroup]="form" class="space-y-4">

  <div>
    <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Department Details</h3>
    <div class="grid grid-cols-3 gap-x-4 gap-y-3">

      <div class="flex flex-col gap-1">
        <label class="text-xs font-medium text-slate-600">Name <span class="text-red-500">*</span></label>
        <input type="text" formControlName="name" placeholder="e.g. Human Resources"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white text-slate-900 placeholder-slate-400
                 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors">
      </div>

      <div class="flex flex-col gap-1 col-span-2">
        <label class="text-xs font-medium text-slate-600">Description</label>
        <input type="text" formControlName="description" placeholder="Brief description of the department"
          class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white text-slate-900 placeholder-slate-400
                 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors">
      </div>

      @if (isSuperAdmin) {
        <div class="flex flex-col gap-1">
          <label class="text-xs font-medium text-slate-600">Company <span class="text-red-500">*</span></label>
          <select formControlName="companyId"
            class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white text-slate-900
                   focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-colors cursor-pointer">
            <option value="">Select Company</option>
            @for (company of companies; track company.id) {
              <option [value]="company.id">{{ company.name }}</option>
            }
          </select>
        </div>
      }

    </div>
  </div>

</form>
