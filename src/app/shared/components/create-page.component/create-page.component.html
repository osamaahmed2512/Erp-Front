<div class="flex flex-col min-h-full">

  <!-- Sub-page header -->
  <header class="flex items-center justify-between px-6 py-3.5 bg-white border-b border-slate-200 flex-shrink-0">
    <div class="flex items-center gap-3">
      <button
        (click)="cancelEvent.emit()"
        class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-700 transition-all">
        <lucide-icon name="ArrowLeft" class="w-4 h-4"></lucide-icon>
      </button>
      <h1 class="text-base font-semibold text-slate-900">Create New {{ entityName }}</h1>
    </div>

    <div class="flex items-center gap-2.5">
      <button
        (click)="cancelEvent.emit()"
        class="px-4 py-2 text-sm font-medium text-slate-600 rounded-lg border border-slate-200 hover:bg-slate-50 transition-all">
        Cancel
      </button>
      <button
        type="submit"
        [disabled]="isSaving"
        (click)="saveEvent.emit()"
        class="px-5 py-2 text-sm font-semibold text-white rounded-lg bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-not-allowed transition-all flex items-center gap-2 shadow-sm">
        @if (isSaving) {
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
          Saving…
        } @else {
          Save
        }
      </button>
    </div>
  </header>

  <!-- Form body -->
  <div class="flex-1 overflow-auto p-4 bg-surface">
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
      <ng-content></ng-content>
    </div>
  </div>

</div>
