<div class="relative" [class.w-52]="compact" [class.w-full]="!compact" [class.sm:w-72]="!compact">
  @if (!compact) {
    <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">{{ label }}</label>
  }
  <div class="relative">
    <input type="search"
           [(ngModel)]="query"
           (focus)="showOptions()"
           (input)="showOptions(); clearIfEmpty()"
           (blur)="closeOptions()"
           [placeholder]="allowAll ? 'All companies' : 'Search company...'"
           autocomplete="off"
           class="w-full rounded-lg border border-slate-200 bg-white py-2 pl-3 pr-9 text-sm text-slate-800 shadow-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20">
    <svg class="pointer-events-none absolute right-3 top-2.5 h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/>
    </svg>
  </div>

  @if (open) {
    <div class="absolute z-30 mt-1 max-h-64 w-full overflow-y-auto rounded-lg border border-slate-200 bg-white p-1 shadow-xl">
      @if (allowAll) {
        <button type="button" (mousedown)="$event.preventDefault()" (click)="selectCompany(null)"
                class="flex w-full rounded-md px-3 py-2 text-left text-sm hover:bg-slate-50"
                [class.bg-indigo-50]="!selectedCompanyId">
          All companies
        </button>
      }
      @for (company of filteredCompanies; track company.id) {
        <button type="button" (mousedown)="$event.preventDefault()" (click)="selectCompany(company)"
                class="flex w-full rounded-md px-3 py-2 text-left text-sm hover:bg-slate-50"
                [class.bg-indigo-50]="selectedCompanyId === company.id"
                [class.text-indigo-700]="selectedCompanyId === company.id">
          {{ company.name }}
        </button>
      } @empty {
        <p class="px-3 py-2 text-sm text-slate-400">No companies found.</p>
      }
    </div>
  }
</div>
