<header class="flex items-center justify-between gap-4 px-6 py-4 flex-wrap">

  <!-- Title -->
  <h1 class="text-xl font-bold text-slate-900 tracking-tight flex-shrink-0">{{ title }}</h1>

  <!-- Right side: search + page filters + export + add -->
  <div class="flex items-center gap-2.5 flex-wrap">

    @if (showSearch) {
      <!-- Search input -->
      <div class="relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
        </svg>
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (input)="onSearchInput()"
          [placeholder]="searchPlaceholder"
          class="pl-9 pr-4 py-2 w-52 text-sm border border-slate-200 rounded-lg bg-white text-slate-700 placeholder-slate-400
                 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all shadow-sm" />
      </div>

    }

    <ng-content select="[headerFilters]"></ng-content>

    <!-- Export -->
    @if (showAdd) { <button
      (click)="exportClick.emit()"
      class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-slate-600 border border-slate-200 rounded-lg bg-white hover:bg-slate-50 transition-all shadow-sm">
      {{ exportText }}
    </button>

    <!-- Add New -->
    <button
      (click)="addClick.emit()"
      class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-semibold text-white rounded-lg bg-indigo-600 hover:bg-indigo-700 transition-all shadow-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      {{ addText }}
    </button> }

  </div>
</header>
